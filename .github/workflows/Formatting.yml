name: Formatting

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Check formatting
        run: |
          julia --project=. -e '
            using Pkg;
            Pkg.instantiate();
            using JuliaFormatter;
            format(".", overwrite=false)'