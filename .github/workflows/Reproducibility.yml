name: Reproducibility

on:
  workflow_dispatch:

jobs:
  reproduce-paper:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Instantiate
        run: |
          julia --project=. -e '
            using Pkg;
            Pkg.instantiate()'

      - name: Run every test script
        run: |
          for script in scripts/*/L*.jl; do
            echo "::group::$script"
            julia --project=. -O1 "$script"
            echo "::endgroup::"
          done

      - name: Upload figures, tables and processed data
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            plots/
            data/exp_pro/
          if-no-files-found: warn