name: Reproducibility

on:
  workflow_dispatch:

jobs:
  reproduce-paper:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Instantiate
        run: |
          julia --project=. -e '
            using Pkg;
            Pkg.instantiate()'

      - name: Run verification suite
        run: |
          julia --project=. -O1 -e '
            using HydroElasticFEM_xxx2026;
            run_tests("all")'

      - name: Upload figures, tables and processed data
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            plots/
            data/exp_pro/
          if-no-files-found: warn